<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>LiteVault - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<style>
:root {
    --primary: #064c3a;
    --primary-dark: #04382b;
    --primary-light: #0a604b;
    --background: #f2f1e9;
    --white: #ffffff;
    --text: #202925;
    --text-light: #606762;
    --text-muted: #8b918b;
    --border: #deded8;
}


* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    font-family:Arial,Helvetica,sans-serif;
    background: var(--background);
    color: var(--text);
}

.auth-page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 84px;
}

.auth-container {
    width: 300px;
    max-width: 100%;
}

.brand {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7px;
    margin-bottom: 30px;
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
}

.brand-icon {
    width: 23px;
    height: 23px;
    border-radius: 5px;
    background: var(--primary);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
}

.auth-heading {
    text-align: left;
    margin-bottom: 22px;
}

.auth-heading h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 5px;
}

.auth-heading p {
    font-size: 10px;
    color: var(--text-light);
    margin: 0;
}

.form-group {
    margin-bottom: 13px;
}

.form-group label {
    display: block;
    font-size: 9px;
    font-weight: 600;
    color: var(--text-light);
    margin-bottom: 6px;
}

.form-control {
    height: 37px;
    width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--text);
    font-size: 10px;
    padding: 0 12px;
    box-shadow: none;
}

.form-control::placeholder {
    color: #aaa;
}


.form-control:focus {
    border-color: var(--primary);
    box-shadow:0 0 0 2px rgba(6, 76, 58, 0.08);
}

.password-wrapper {
    position: relative;
}

.password-wrapper .form-control {
    padding-right: 40px;
}

.password-toggle {
    position: absolute;
    right: 11px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #89908b;
    cursor: pointer;
    font-size: 11px;
}

.password-toggle:hover {
    color: var(--primary);
}

.password-hint {
    display: block;
    margin-top: 5px;
    font-size: 8px;
    color: var(--text-muted);
}

.password-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.password-label label {
    margin-bottom: 6px;
}

.password-label a {
    font-size: 9px;
    color: var(--primary);
    text-decoration: none;
    margin-bottom: 6px;
}

.password-label a:hover {
    text-decoration: underline;
}


.auth-button {
    width: 100%;
    height: 39px;
    border-radius: 8px;
    background: var(--primary);
    color: white;
    border: none;
    font-size: 10px;
    font-weight: 600;
    margin-top: 2px;
    transition: 0.2s ease;
}

.auth-button:hover {
    background: var(--primary-dark);
    color: white;
}

.auth-button:active {
    transform: scale(0.99);
}

.terms {
    text-align: left;
    font-size: 8px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-top: 10px;
}

.terms a {
    color: var(--text-light);
    text-decoration: underline;
}

.bottom-link {
    text-align: center;
    font-size: 9px;
    color: var(--text-light);
    margin-top: 18px;
}

.bottom-link a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}

.bottom-link a:hover {
    text-decoration: underline;
}

.login-container {
    width: 300px;
}

.login-container .brand {
    margin-bottom: 30px;
}

.login-container .auth-heading {
    margin-bottom: 23px;
}

.or-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 15px 0;
    color: #a1a5a1;
    font-size: 8px;
}

.or-divider::before,
.or-divider::after {
    content: "";
    height: 1px;
    background: transparent;
    flex: 1;
}

.or-divider span {
    color: #a1a5a1;
}

.phone-button {
    width: 100%;
    height: 42px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 10px;
    font-weight: 600;
    transition: 0.2s ease;
}

.phone-button i {
    color: var(--primary);
    margin-right: 8px;
}

.phone-button:hover {
    background: #fafaf7;
    border-color: #c8cec9;
}

@media (max-width: 768px) {
    .auth-page {
        padding-top: 70px;
        padding-left: 20px;
        padding-right: 20px;
    }
}

@media (max-width: 576px) {
    .auth-page {
        min-height: 100vh;
        padding-top: 50px;
        padding-left: 20px;
        padding-right: 20px;
        align-items: flex-start;
    }

    .auth-container,
    .login-container {
        width: 100%;
        max-width: 340px;
    }

    .brand {
        margin-bottom: 27px;
    }

    .auth-heading h1 {
        font-size: 17px;
    }

    .auth-heading p {
        font-size: 10px;
    }

    .form-control {
        height: 42px;
        font-size: 11px;
    }

    .auth-button {
        height: 42px;
        font-size: 11px;
    }

    .phone-button {
       height: 43px;
    }
}

@media (max-width: 380px) {
    .auth-page {
        padding-top: 35px;
    }

    .auth-container,
    .login-container {
        max-width: 100%;
    }

    .brand {
        margin-bottom: 23px;
    }

    .auth-heading {
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 12px;
    }
}
</style>
<body>
    {%if messages %}
  <ul class="messages">
    {% for message in messages%}
      <li {% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
  </ul>
  {% endif %}

<!-- program for wrong password  -->
 <p style="color: red; text-align:center;">
    {% if error %}
      {{ error }}
    {% endif %}  
 </p>
<main class="auth-page">
    <div class="auth-container login-container">
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-droplet"></i>
             </div>
                <span>LiteVault</span>
        </div>

        <div class="auth-heading">
            <h1>Welcome back</h1>
            <p>Log in to manage your litres</p>
        </div>

        <form method="post" action="/login/">

            {% csrf_token %}
            <div class="form-group">
                <label for="loginEmail">Email or phone number</label>
                <input type="text"id="loginEmail"class="form-control"placeholder="Enter email or phone number"required name="email">
            </div>

            <div class="form-group">
                <div class="password-label">
                    <label for="loginPassword">Password</label>
                    <a href="#">Forgot?</a>
                </div>

                <div class="password-wrapper">
                    <input type="password"id="loginPassword"class="form-control"placeholder="Enter password"required name="password">
                    <button type="button"class="password-toggle"onclick="togglePassword('loginPassword', 'loginEye')"><i class="fa-regular fa-eye"id="loginEye"></i></button>
                </div>

            </div>

            <button type="submit" class="btn auth-button">Log In</button>
                <div class="or-divider">
                  <span>OR</span>
                </div>
            <button type="button"class="btn phone-button"><i class="fa-solid fa-phone"></i>Continue with phone number</button>
        </form>

        <div class="bottom-link">Don't have an account?
            <a href="{% url 'user-register' %}">Create one</a>
        </div>
    </div>
</main>
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
</body>
</html>
